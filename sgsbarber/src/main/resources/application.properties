spring.application.name=sgsbarber
server.port=8080
server.address=0.0.0.0

# Supabase: use the connection string from the Session Pooler in production.
# Local defaults keep the project runnable without exposing credentials in git.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres.lffromprwnygrbzamook}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${SUPABASE_DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.data-source-properties.sslmode=${SUPABASE_DB_SSLMODE:require}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
