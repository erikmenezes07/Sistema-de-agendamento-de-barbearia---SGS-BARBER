spring.application.name=sgs-barber

# Carrega a configuracao local de desenvolvimento (chave de IA, provedor,
# modelo) sem precisar ativar perfil nem passar parametro na linha de comando.
# O "optional" faz o Spring seguir em frente se o arquivo nao existir, e o
# arquivo e ignorado pelo git. Variavel de ambiente ainda tem prioridade.
spring.config.import=optional:file:./ia-local.properties,optional:file:../ia-local.properties

# =========================
# Banco de dados
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/sgs_barber_db
spring.datasource.username=postgres
spring.datasource.password=123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================
# Modulo de IA (orquestrador)
# =========================
# IMPORTANTE: a chave nunca vai para o codigo nem para o git.
# Ponha a chave no arquivo local ia-local.properties (ja ignorado pelo git) ou
# defina a variavel de ambiente antes de rodar a aplicacao:
#   Windows PowerShell :  $env:IA_API_KEY="..."
#   Linux/macOS        :  export IA_API_KEY="..."
# Sem a chave, o sistema sobe e responde pelo agente local de regras.
# O padrao abaixo aponta para um provedor OpenAI-compatível vazio de propósito:
# quem usa Gemini sobrescreve base-url e modelo no ia-local.properties.
ia.habilitada=${IA_HABILITADA:true}
ia.api-key=${IA_API_KEY:}
ia.base-url=${IA_BASE_URL:https://api.openai.com/v1}
ia.modelo=${IA_MODELO:gpt-4o-mini}
ia.temperatura=${IA_TEMPERATURA:0.2}
ia.timeout-ms=${IA_TIMEOUT_MS:30000}
# Retentativa quando o provedor responde 429/5xx. O plano gratuito do Gemini
# devolve 503 "high demand" em chamada grande; repetir evita cair no fallback.
ia.max-tentativas=${IA_MAX_TENTATIVAS:3}
ia.espera-retry-ms=${IA_ESPERA_RETRY_MS:2500}
ia.max-iteracoes=${IA_MAX_ITERACOES:6}
# Historico reenviado ao provedor a cada iteracao do loop de tools. 20 mensagem
# faz o custo crescer sem necessidade para um chat de agendamento.
ia.max-mensagens-no-contexto=${IA_MAX_MENSAGENS:8}
# Teto de tokens de resposta. Limita custo e cota quando o modelo divaga.
ia.max-tokens=${IA_MAX_TOKENS:700}
ia.permitir-fallback-sem-chave=${IA_FALLBACK:true}

# Liga/desliga a aba do assistente no front-end.
# Com false, POST /api/chat responde 503 e o projeto sobe sem nenhuma chamada
# de IA. Com true e sem IA_API_KEY, o back-end responde pelo agente de regras.
ia.agendador-ativo=${IA_AGENDADOR_ATIVO:true}

# =========================
# CORS
# =========================
# Vazio (padrao) = libera apenas loopback em qualquer porta, que e o caso de
# desenvolvimento com HTML aberto. Em producao, liste os dominios reais:
# sgs.cors.origens-autorizadas=https://app.exemplo.com,https://www.exemplo.com
sgs.cors.origens-autorizadas=${CORS_ORIGENS:}

# =========================
# Log
# =========================
logging.level.sgs_barber.ia=INFO
