spring.application.name=sgsbarber
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}

# Nomes originais preservados para compatibilidade com Supabase.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/sgsbarber}
spring.datasource.username=${SUPABASE_DB_USERNAME:sgsbarber}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${SUPABASE_DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.data-source-properties.sslmode=${SUPABASE_DB_SSLMODE:disable}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
